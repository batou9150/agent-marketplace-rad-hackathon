steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${_TAG}'
      - '-f'
      - 'deploy/Dockerfile'
      - '.'
images:
  - '${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${_TAG}'
substitutions:
  _LOCATION: 'us-central1'
  _REPO: 'vibe-guard'
  _IMAGE: 'vibe-guard-a2ui'
  _TAG: 'latest'
options:
  logging: CLOUD_LOGGING_ONLY
