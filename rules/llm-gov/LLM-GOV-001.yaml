id: LLM-GOV-001
family: LLM-GOV
severity: high
title: "Appel direct à un SDK ou endpoint LLM sans passerelle ni proxy de sécurité"
rationale: "Effectuer des appels directs aux clients LLM tiers (OpenAI, Anthropic) ou à des endpoints publics non gouvernés court-circuite les politiques de DLP, d'audit des tokens et les filtres de sécurité d'entreprise comme Google Cloud Model Armor."
example: |
  from openai import OpenAI
  client = OpenAI(api_key="test-key")
remediation:
  summary: "Router les requêtes LLM via Google Cloud Vertex AI et Agent Gateway avec Model Armor"
  gcp_service: "Vertex AI & Google Cloud Model Armor"
  steps:
    - "Migrer vers les API Vertex AI hébergées sur Google Cloud au lieu d'instancier des SDKs tiers non gouvernés"
    - "Déployer une Agent Gateway Google Cloud avec Model Armor (CONTENT_AUTHZ) activé pour inspecter les flux"
    - "Activer les filtres de protection contre le jailbreak et la détection de fuites de données sensibles (SDP)"
  reference_url: "https://cloud.google.com/vertex-ai/generative-ai/docs/model-armor/overview"
engine:
  type: semgrep
  semgrep_rule:
    id: llm-direct-public-endpoint
    message: "Appel direct à un SDK ou endpoint d'API LLM non gouverné"
    languages: [python]
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: OpenAI(...)
          - pattern: Anthropic(...)
          - pattern-regex: 'https://(api\.openai\.com|generativelanguage\.googleapis\.com|api\.anthropic\.com)'
      - pattern-not: OpenAI(..., base_url=$URL, ...)
      - pattern-not: Anthropic(..., base_url=$URL, ...)
