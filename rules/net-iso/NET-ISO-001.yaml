id: NET-ISO-001
family: NET-ISO
severity: medium
title: "Service Cloud Run configuré avec ingress ouvert à tout Internet en Terraform"
rationale: "Configurer l'annotation d'ingress à 'all' dans les manifestes Terraform autorise le trafic direct depuis n'importe quelle adresse IP publique d'Internet vers le service Cloud Run, court-circuitant l'inspection par un Cloud Load Balancer avec Cloud Armor et Identity-Aware Proxy."
example: |
  resource "google_cloud_run_service" "app" {
    name     = "vibe-service"
    location = "europe-west1"
    metadata {
      annotations = {
        "run.googleapis.com/ingress" = "all"
      }
    }
  }
remediation:
  summary: "Restreindre l'ingress Cloud Run à 'internal-and-cloud-load-balancing' et ajouter Cloud Armor"
  gcp_service: "Cloud Run & Google Cloud Armor"
  steps:
    - "Modifier l'annotation 'run.googleapis.com/ingress' pour la définir à 'internal-and-cloud-load-balancing'"
    - "Déployer un Cloud Load Balancer HTTPS externe avec une politique Google Cloud Armor (WAF)"
    - "Restreindre l'accès au réseau d'entreprise ou filtrer les flux via Identity-Aware Proxy (IAP)"
  reference_url: "https://cloud.google.com/run/docs/securing/ingress"
engine:
  type: semgrep
  semgrep_rule:
    id: net-terraform-cloudrun-ingress-all
    message: "Service Cloud Run configuré avec ingress ouvert à tout Internet (ingress = all)"
    languages: [terraform]
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: '"run.googleapis.com/ingress" = "all"'
          - pattern: 'ingress = "all"'
          - pattern: 'ingress = "INGRESS_TRAFFIC_ALL"'
