id: NET-ISO-003
family: NET-ISO
severity: high
title: "Image de conteneur s'exécutant sous l'utilisateur root ou exposant un port de debug"
rationale: "Exécuter des processus applicatifs en tant qu'utilisateur root (UID 0) au sein d'un conteneur ou exposer des ports d'outils de debug (ex: 5678 pour debugpy) viole le principe de moindre privilège et facilite les attaques par évasion de conteneur."
example: |
  FROM python:3.12-slim
  WORKDIR /app
  USER root
  EXPOSE 5678
  CMD ["python", "server.py"]
remediation:
  summary: "Créer un utilisateur non-root dédié dans le Dockerfile et fermer les ports de debug"
  gcp_service: "Cloud Run & Google Artifact Registry"
  steps:
    - "Créer un utilisateur applicatif non privilégié dans le Dockerfile (ex: RUN useradd -m -u 10001 appuser)"
    - "Définir la directive 'USER appuser' avant l'instruction CMD"
    - "Supprimer les instructions EXPOSE associées à des serveurs de debug (ex: 5678)"
  reference_url: "https://cloud.google.com/run/docs/container-contract#uid"
engine:
  type: semgrep
  semgrep_rule:
    id: net-dockerfile-root-or-debug
    message: "Exécution sous l'utilisateur root ou exposition de port de debug dans le Dockerfile"
    languages: [dockerfile]
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern-regex: 'USER\s+(root|0)\b'
          - pattern-regex: 'EXPOSE\s+.*5678'
