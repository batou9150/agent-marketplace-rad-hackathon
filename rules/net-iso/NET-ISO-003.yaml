id: NET-ISO-003
family: NET-ISO
severity: high
title: "Conteneur Dockerfile s'exécutant avec l'utilisateur root ou exposant un port de débogage"
rationale: "Exécuter un conteneur en tant que root affaiblit grandement l'isolation en cas d'échappement de conteneur. De même, exposer des ports de débogage distant (ex. 5678 pour debugpy, 9229 pour node inspect) permet l'exécution de code arbitraire à distance."
example: |
  USER root
  EXPOSE 5678
remediation:
  summary: "Exécuter le conteneur sous un utilisateur non privilégié et fermer les ports de débogage"
  gcp_service: "Cloud Run Container Runtime"
  steps:
    - "Créer un groupe et un utilisateur applicatif non-root (ex. 'RUN addgroup -S app && adduser -S app -G app') et ajouter 'USER app'"
    - "Supprimer toute exposition de ports de débogage ('EXPOSE 5678', 'EXPOSE 9229')"
    - "N'exposer que le port applicatif standard attendu par Cloud Run ($PORT)"
  reference_url: "https://cloud.google.com/run/docs/developing#container"
engine:
  type: semgrep
  semgrep_rule:
    id: net-dockerfile-root-or-debug-port
    languages: [dockerfile]
    severity: WARNING
    message: "Instruction USER root ou exposition de port de débogage distant dans le Dockerfile"
    pattern-either:
      - pattern: USER root
      - pattern-regex: "(?i)EXPOSE\\s+(5678|5005|9229|8000)"
