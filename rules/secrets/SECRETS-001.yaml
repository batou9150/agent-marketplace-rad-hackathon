id: SECRETS-001
family: SECRETS
severity: critical
title: "Clé d'API ou secret d'authentification hardcodé dans le code source"
rationale: "L'inclusion directe de clés d'API (OpenAI, Anthropic, Google Gemini, clés de services) dans le code source expose l'organisation à un vol de crédits, à des fuites de données et à une compromission des services en cas de partage ou de fuite du dépôt."
example: |
  OPENAI_API_KEY = "sk-proj-abc1234567890abcdef1234567890abcdef"
  client = OpenAI(api_key=OPENAI_API_KEY)
remediation:
  summary: "Migrer les secrets vers Google Secret Manager et utiliser l'authentification ADC / Service Accounts"
  gcp_service: "Google Cloud Secret Manager"
  steps:
    - "Révoquer et renouveler immédiatement la clé compromise auprès du fournisseur"
    - "Stocker la nouvelle clé dans Google Cloud Secret Manager (gcloud secrets create ...)"
    - "Accorder le rôle 'roles/secretmanager.secretAccessor' au compte de service de l'application"
    - "Pour Vertex AI et les services Google Cloud, supprimer la clé d'API statique et utiliser l'Application Default Credentials (ADC)"
  reference_url: "https://cloud.google.com/secret-manager/docs/overview"
engine:
  type: gitleaks
  gitleaks_rule:
    rule_id: "all"
    description: "Détection de clés d'API et secrets hardcodés via gitleaks"
