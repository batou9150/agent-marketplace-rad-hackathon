id: SECRETS-003
family: SECRETS
severity: critical
title: "Secret ou clé d'API défini en clair dans une instruction ENV Dockerfile"
rationale: "Définir des identifiants ou clés d'API via la directive ENV dans un Dockerfile incorpore de manière indélébile le secret dans les métadonnées et couches de l'image de conteneur, le rendant visible par toute personne ou système ayant accès au registre d'images."
example: |
  FROM python:3.12-slim
  ENV OPENAI_API_KEY="sk-proj-secret-token-12345"
  COPY . /app
remediation:
  summary: "Supprimer les secrets du Dockerfile et utiliser le montage de secrets Cloud Run / Secret Manager à l'exécution"
  gcp_service: "Google Cloud Secret Manager & Cloud Run"
  steps:
    - "Supprimer immédiatement l'instruction ENV contenant le secret du Dockerfile"
    - "Pour les besoins du build (ex: accès à un dépôt privé), utiliser 'RUN --mount=type=secret,id=...' avec Cloud Build"
    - "Pour l'exécution applicative, injecter la valeur au déploiement Cloud Run depuis Google Secret Manager (--set-secrets VAR=secret-name:latest)"
  reference_url: "https://cloud.google.com/run/docs/configuring/secrets"
engine:
  type: semgrep
  semgrep_rule:
    id: secrets-dockerfile-env-plaintext
    message: "Instruction ENV Dockerfile contenant un secret ou une clé d'API en clair"
    languages: [dockerfile]
    severity: ERROR
    pattern-regex: 'ENV\s+.*(API_KEY|SECRET|PASSWORD|TOKEN|AUTH)\s*=.*'
