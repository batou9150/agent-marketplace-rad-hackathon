id: SECRETS-002
family: SECRETS
severity: high
title: "Chargement de fichier .env ou gestion manuelle de variables d'environnement secrètes"
rationale: "Le chargement de fichiers .env via load_dotenv() ou dotenv.config() dans le code applicatif favorise l'exposition accidentelle de secrets locaux lors des déploiements ou dans l'historique de versionnement Git."
example: |
  from dotenv import load_dotenv
  load_dotenv(".env")
remediation:
  summary: "Supprimer load_dotenv() et injecter les secrets via Google Secret Manager et Cloud Run"
  gcp_service: "Google Cloud Secret Manager & Cloud Run"
  steps:
    - "Supprimer les appels 'load_dotenv()' ou 'dotenv.config()' du code applicatif"
    - "Stocker les variables sensibles dans Google Secret Manager (gcloud secrets create ...)"
    - "Lier les secrets au service Cloud Run via '--set-secrets VAR=SECRET_NAME:latest' lors du déploiement"
  reference_url: "https://cloud.google.com/run/docs/configuring/secrets"
engine:
  type: semgrep
  semgrep_rule:
    id: secrets-dotenv-loading
    message: "Chargement d'un fichier .env détecté dans le code source applicatif"
    languages: [python, javascript, typescript]
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: load_dotenv(...)
          - pattern: dotenv.config(...)
