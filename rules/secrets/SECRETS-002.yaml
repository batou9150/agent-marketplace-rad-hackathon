id: SECRETS-002
family: SECRETS
severity: high
title: "Fichier d'environnement .env contenant des identifiants ou clés sensibles"
rationale: "La présence d'un fichier .env contenant des clés d'API, mots de passe ou tokens dans le répertoire du projet conduit fréquemment à son injection accidentelle dans le contrôle de code source (Git) ou dans les images de conteneurs distribuées."
example: |
  # .env
  DATABASE_URL="postgres://user:supersecret@localhost:5432/db"
  ANTHROPIC_API_KEY="sk-ant-api03-abcdef1234567890"
remediation:
  summary: "Ajouter .env au .gitignore et charger les secrets dynamiquement depuis Google Secret Manager"
  gcp_service: "Google Cloud Secret Manager"
  steps:
    - "Ajouter immédiatement '.env' et '.env.*' au fichier '.gitignore'"
    - "Purger les fichiers .env de l'historique Git si déjà commités (git rm --cached .env)"
    - "Injecter les variables sensibles à l'exécution sur Cloud Run via les références Secret Manager (gcloud run deploy --set-secrets)"
  reference_url: "https://cloud.google.com/run/docs/configuring/secrets"
engine:
  type: semgrep
  semgrep_rule:
    id: secrets-env-file-versioned
    message: "Fichier d'environnement contenant des valeurs sensibles détecté"
    languages: [generic]
    severity: WARNING
    patterns:
      - pattern-regex: '(?i)(api_key|secret|token|password|db_pass)\s*=\s*[''"]?[a-zA-Z0-9_\-\.\:\/\@]{8,}[''"]?'
